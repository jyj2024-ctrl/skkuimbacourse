<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKKU IMBA 2026-2 과목비교</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="logo"><span class="logo-mark">S</span> SKKU IMBA 과목비교</div>
      <div class="header-actions">
        <span class="badge badge-notice">⚠ 같은 그룹 과목은 동시 수강이 불가합니다</span>
        <div id="saved-lists-area" class="saved-lists-area hidden">
          <button type="button" id="saved-lists-toggle" class="saved-lists-toggle">저장 목록</button>
          <div id="saved-lists-panel" class="saved-lists-panel hidden"></div>
        </div>
        <div id="auth-area" class="auth-area"></div>
      </div>
    </div>
    <h1 class="hero-title">2026년 2학기, <em>어떤 과목</em>을<br />들을지 <strong>비교</strong>해보세요</h1>
    <p class="hero-subtitle">그룹 A~F · 전공기반/전공심화 · 교수·학생 의견·강의계획서 요약까지 한눈에</p>
  </header>

  <div class="toolbar">
    <input id="search-input" type="text" class="search-input" placeholder="과목명 또는 교수명 검색" />
    <div class="filter-row">
      <div class="filter-group" id="field-filter" data-value="all">
        <button type="button" class="filter-pill is-active" data-value="all">분야 전체</button>
        <button type="button" class="filter-pill" data-value="Marketing/Management">Marketing/Management</button>
        <button type="button" class="filter-pill" data-value="Accounting/Finance">Accounting/Finance</button>
        <button type="button" class="filter-pill" data-value="Global/Innovation">Global/Innovation</button>
      </div>
      <div class="filter-group" id="group-filter" data-value="all">
        <button type="button" class="filter-pill is-active" data-value="all">그룹 전체</button>
        <button type="button" class="filter-pill" data-value="A">A</button>
        <button type="button" class="filter-pill" data-value="B">B</button>
        <button type="button" class="filter-pill" data-value="C">C</button>
        <button type="button" class="filter-pill" data-value="D">D</button>
        <button type="button" class="filter-pill" data-value="E">E</button>
        <button type="button" class="filter-pill" data-value="F">F</button>
      </div>
    </div>
  </div>

  <main id="course-list"></main>

  <section id="compare-section" class="compare-section hidden"></section>

  <section id="schedule-section" class="schedule-section hidden"></section>

  <div id="compare-bar" class="compare-bar hidden">
    <div class="compare-bar-inner">
      <span class="compare-count">0개 과목 선택됨</span>
      <div class="compare-chips"></div>
      <span class="compare-warning"></span>
      <div class="compare-bar-actions">
        <button type="button" id="reset-btn" class="btn btn-ghost">초기화</button>
        <button type="button" id="save-list-btn" class="btn btn-ghost">목록으로 저장</button>
        <button type="button" id="schedule-btn" class="btn btn-primary hidden">수업일정표 보기</button>
        <button type="button" id="compare-btn" class="btn btn-primary">비교하기</button>
      </div>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <button type="button" id="modal-close" class="modal-close" aria-label="닫기">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="save-list-modal-overlay" class="modal-overlay hidden">
    <div class="modal save-list-modal" role="dialog" aria-modal="true">
      <button type="button" id="save-list-modal-close" class="modal-close" aria-label="닫기">×</button>
      <h3 class="save-list-modal-title">목록 저장</h3>
      <p id="save-list-modal-hint" class="save-list-modal-hint"></p>
      <input type="text" id="save-list-name-input" class="save-list-name-input" placeholder="목록 이름 (예: 1안, 2안)" maxlength="40" />
      <div class="save-list-modal-actions">
        <button type="button" id="save-list-update-btn" class="btn btn-primary hidden">이 목록 업데이트</button>
        <button type="button" id="save-list-new-btn" class="btn btn-primary">새 목록으로 저장</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="data.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
  <script type="module" src="auth.js"></script>
  <script type="module" src="saved-lists.js"></script>
</body>
</html>
